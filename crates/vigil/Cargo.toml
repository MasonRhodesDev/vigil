[package]
name = "vigil"
description = "Multi-monitor greetd greeter rendering directly on KMS/DRM"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vigil-core.workspace = true
vigil-config.workspace = true
monitor-profiles.workspace = true
vigil-session = { path = "../vigil-session" }
vigil-outputs = { path = "../vigil-outputs" }
vigil-present-dumb = { path = "../vigil-present-dumb" }
vigil-input = { path = "../vigil-input" }
vigil-auth = { path = "../vigil-auth" }
vigil-theme = { path = "../vigil-theme" }
vigil-ui = { path = "../vigil-ui" }
vigil-login = { path = "../vigil-login" }
# The GL path used to be opt-in (DESIGN.md §7). Production greeters on
# HiDPI/rotated desks need it; packaging and the default feature gate now
# enable GL. Software-only: `cargo build --no-default-features`.
vigil-gl = { path = "../vigil-gl", optional = true }
vigil-present-gl = { path = "../vigil-present-gl", optional = true }
calloop.workspace = true

[dev-dependencies]
image.workspace = true

[features]
default = ["gl"]
gl = ["dep:vigil-gl", "dep:vigil-present-gl"]
