[package]
name = "vigil-input"
description = "libinput + xkbcommon; key repeat/compose -> normalized InputEvents"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Opens the keyboard state to the fuzz target; nothing else enables it.
fuzzing = []

[dependencies]
vigil-log.workspace = true
vigil-core.workspace = true
smithay = { workspace = true, features = ["backend_libinput"] }
input = { version = "0.9", default-features = false, features = ["udev"] }
xkbcommon.workspace = true

[lints]
workspace = true
