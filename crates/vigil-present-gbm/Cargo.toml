[package]
name = "vigil-present-gbm"
description = "GbmPresenter: femtovg/GL into a GBM surface, scanned out on a DRM CRTC"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vigil-core.workspace = true
vigil-gl = { path = "../vigil-gl" }
smithay = { workspace = true, features = ["backend_drm", "backend_gbm", "backend_egl"] }
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }

[dev-dependencies]
slint = { workspace = true }
slint-interpreter.workspace = true
