[package]
name = "vigil-gl"
description = "EGL/GBM context and Slint OpenGLInterface for the GL rendering path"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vigil-log.workspace = true
slint-idle-runtime.workspace = true
vigil-core.workspace = true
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg"] }
smithay = { workspace = true, features = ["backend_egl", "backend_gbm", "backend_drm"] }
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }

[dev-dependencies]
image.workspace = true
slint-interpreter.workspace = true
drm = "0.14"

[lints]
workspace = true
