[package]
name = "vigil-present-gl"
description = "GbmGlPresenter (M3): FemtoVG over GBM/EGL behind the same Presenter trait"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vigil-core.workspace = true
vigil-gl = { path = "../vigil-gl" }
smithay = { workspace = true, features = ["backend_drm", "backend_gbm", "backend_egl"] }
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }

[dev-dependencies]
vigil-ui = { path = "../vigil-ui" }
vigil-theme = { path = "../vigil-theme" }
slint = { workspace = true }
slint-interpreter.workspace = true
