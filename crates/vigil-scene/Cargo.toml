[package]
name = "vigil-scene"
description = "The boot scene, drawn the same at every stage: geometry, logo, glow, ground and bar"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde_json.workspace = true
image.workspace = true
resvg = { version = "0.47", default-features = false }
rustix = { version = "1.1", features = ["event", "fs", "process", "thread"] }
libc.workspace = true
vigil-secret.workspace = true

[[bin]]
name = "vigil-scene"
path = "src/main.rs"

[dev-dependencies]
vigil-scene-corpus = { path = "../vigil-scene-corpus" }

[lints]
workspace = true
