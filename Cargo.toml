[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.3"
edition = "2024"
license = "GPL-3.0-only"
publish = false
repository = "https://github.com/MasonRhodesDev/vigil"

[workspace.dependencies]
vigil-core = { path = "crates/vigil-core" }
vigil-config = { path = "crates/vigil-config" }
vigil-flow = { path = "crates/vigil-flow" }
monitor-profiles = { git = "https://github.com/MasonRhodesDev/monitor-profiles", rev = "64d5d1ed079582a2014ebf23c403a3ca03ee9c64" }
appearance-profiles = { git = "https://github.com/MasonRhodesDev/appearance-profiles.git", rev = "780296ec160b18411c65982d323562e5617d6465" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
smithay = { version = "0.7.0", default-features = false }
# default display-info feature needs system libdisplay-info < 0.3 (Fedora 44 ships 0.3).
# We only need DrmScanner; EDID names come in M2 via libdisplay-info 0.3 directly.
smithay-drm-extras = { version = "0.1", default-features = false }
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }
slint-interpreter = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2"] }
slint-idle-runtime = { git = "https://github.com/MasonRhodesDev/slint-idle-runtime", tag = "v0.2.0" }
singleton-guard = { git = "https://github.com/MasonRhodesDev/desktop-commons", rev = "43229f9" }
span-lines = { git = "https://github.com/MasonRhodesDev/desktop-commons", rev = "51680cb", features = ["tracing"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
greetd_ipc = { version = "0.10", features = ["sync-codec"] }
xkbcommon = "0.9"
calloop = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
calloop-wayland-source = "0.4"
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-backend = "0.3"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
pam-client = "=0.5.0"
vigil-login = { path = "crates/vigil-login" }
# blocking API over zbus's own internal executor: vigil has no async runtime
# and must not gain one (the in-house `tokio` precedent does not apply here).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
slint-kit = { git = "https://github.com/MasonRhodesDev/slint-kit", rev = "ccd7397c3da83ff835d6295d6ec3841fc32c8bac", default-features = false }
xdg-paths = "0.2.0"
libc = "0.2"
winit = "0.30"
softbuffer = "0.4"
font8x8 = "0.3"
