[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.3"
edition = "2024"
license = "GPL-3.0-only"
publish = false
repository = "https://github.com/MasonRhodesDev/vigil"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
as_ptr_cast_mut = "deny"
cast_ptr_alignment = "deny"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
borrow_as_ptr = "deny"
transmute_ptr_to_ptr = "deny"
transmute_undefined_repr = "deny"
transmutes_expressible_as_ptr_casts = "deny"
uninit_vec = "deny"
uninit_assumed_init = "deny"
mem_replace_with_uninit = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

[workspace.dependencies]
vigil-core = { path = "crates/vigil-core" }
vigil-config = { path = "crates/vigil-config" }
vigil-flow = { path = "crates/vigil-flow" }
vigil-secret = { path = "crates/vigil-secret" }
monitor-profiles = { git = "https://github.com/MasonRhodesDev/monitor-profiles", rev = "64d5d1ed079582a2014ebf23c403a3ca03ee9c64" }
appearance-profiles = { git = "https://github.com/MasonRhodesDev/appearance-profiles.git", rev = "780296ec160b18411c65982d323562e5617d6465" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
smithay = { version = "0.7.0", default-features = false }
smithay-drm-extras = { version = "0.1", default-features = false }
slint = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }
slint-interpreter = { version = "=1.17.1", default-features = false, features = ["std", "compat-1-2"] }
slint-idle-runtime = { git = "https://github.com/MasonRhodesDev/slint-idle-runtime", tag = "v0.2.0" }
singleton-guard = { git = "https://github.com/MasonRhodesDev/desktop-commons", rev = "43229f9" }
span-lines = { git = "https://github.com/MasonRhodesDev/desktop-commons", rev = "266121a", features = ["tracing"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
greetd_ipc = { version = "0.10", features = ["sync-codec"] }
xkbcommon = "0.9"
calloop = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
calloop-wayland-source = "0.4"
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-backend = "0.3"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
pam-client = "=0.5.0"
vigil-login = { path = "crates/vigil-login" }
zbus = { version = "6", default-features = false, features = ["proxy", "default-rt"] }
slint-kit = { git = "https://github.com/MasonRhodesDev/slint-kit", rev = "3581f653546ae1e187bc3f2bb20c54019d0a202a", default-features = false }
xdg-paths = "0.2.0"
libc = "0.2"
winit = "0.30"
softbuffer = "0.4"
font8x8 = "0.3"
