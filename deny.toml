# cargo-deny configuration — supply-chain gate for the binary that IS the
# login screen. Run locally with `cargo deny check`; CI runs it on pushes,
# PRs, and weekly.

[advisories]
version = 2
yanked = "deny"
# Add RUSTSEC IDs here (with a justifying comment) only if an advisory is
# confirmed not to affect us and a fix isn't yet available.
ignore = [
    # Slint's pinned font/text stack; unmaintained-status advisories, not
    # vulnerabilities. Drop each when a slint upgrade sheds the crate.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained dep pinned by slint 1.17's renderer tree" },
    { id = "RUSTSEC-2026-0196", reason = "unmaintained dep pinned by slint 1.17's renderer tree" },
    { id = "RUSTSEC-2026-0206", reason = "unmaintained dep pinned by slint 1.17's renderer tree" },
]

[licenses]
version = 2
# vigil itself is GPL-3.0-only; Slint is consumed under its GPLv3 option
# (its SPDX expression is an OR — GPL-3.0-only satisfying it is the choice
# DESIGN.md §13 records). The rest of the tree is the usual permissive set.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are path deps with no version — that's a
# "wildcard" to cargo-deny. Exempt local path deps; still catch a real
# `foo = "*"` registry wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/MasonRhodesDev/monitor-profiles",
    "https://github.com/MasonRhodesDev/appearance-profiles",
    "https://github.com/MasonRhodesDev/slint-kit",
    "https://github.com/MasonRhodesDev/hypr-paths",
]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
