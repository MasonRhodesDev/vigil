[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "unmaintained dep pinned by slint 1.17's renderer tree" },
    { id = "RUSTSEC-2026-0196", reason = "unmaintained dep pinned by slint 1.17's renderer tree" },
    { id = "RUSTSEC-2026-0206", reason = "unmaintained dep pinned by slint 1.17's renderer tree" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, merged into zbus 6; held at zbus 5 by slint 1.17.1/1.18.1 wasm32-only winit backend" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, merged into zbus 6; held at zbus 5 by slint 1.17.1/1.18.1 wasm32-only winit backend" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, merged into zbus 6; held at zbus 5 by slint 1.17.1/1.18.1 wasm32-only winit backend" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils, unmaintained; pulled in only by slint-macros 1.17.1 via spin_on" },
    { id = "RUSTSEC-2026-0543", reason = "chrono, unmaintained; pulled in only by i-slint-core 1.17.1" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/MasonRhodesDev/monitor-profiles",
    "https://github.com/MasonRhodesDev/appearance-profiles",
    "https://github.com/MasonRhodesDev/slint-kit",
    "https://github.com/MasonRhodesDev/linux-multi-theme-toggle",
    "https://github.com/MasonRhodesDev/slint-idle-runtime",
    "https://github.com/MasonRhodesDev/desktop-commons",
]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
