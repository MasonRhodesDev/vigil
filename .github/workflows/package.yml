name: Package

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-ci:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/rust-ci.yml@v1
    with:
      # smithay backends + xkbcommon + pam (bindgen needs clang)
      pacman-deps: seatd libinput libxkbcommon systemd libdrm mesa pam clang fontconfig ttf-dejavu

  arch:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/arch-package.yml@v1

  rpm:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/rpm-check.yml@v1
    with:
      spec-name: vigil
