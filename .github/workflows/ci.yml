name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: System deps (smithay backends, xkbcommon)
        run: |
          sudo apt-get update
          sudo apt-get install -y libseat-dev libinput-dev libxkbcommon-dev \
            libudev-dev libgbm-dev libdrm-dev libfontconfig-dev libclang-dev libpam0g-dev \
            ripgrep jq dbus
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all --check
      - run: ./tests/check-sim-safety.sh
      - run: ./tests/check-warning-safety.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ./tests/check-sim-scenario.sh

  nested:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: System deps (sway headless + build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y libseat-dev libinput-dev libxkbcommon-dev \
            libudev-dev libgbm-dev libdrm-dev libfontconfig-dev libclang-dev libpam0g-dev \
            sway wtype
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install the lock PAM service (grace unlocks; auth never succeeds)
        run: sudo install -Dm644 dist/vigil-lock.pam /etc/pam.d/vigil-lock
      - run: cargo build -p vigil-lock
      - run: cargo build -p vigil-wayland --example lock_probe
      - run: ./tests/nested/run.sh
      - run: ./tests/nested/attack.sh

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: System deps (libpam, bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libpam0g-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly
          components: miri, rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: PAM conversation and greetd IPC under AddressSanitizer
        run: cargo test -p vigil-pam -p vigil-auth --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Zsanitizer=address
          VIGIL_ATTACK_CASES: 300
      - name: The pure Rust half of vigil-pam under Miri
        run: cargo miri test -p vigil-pam
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: System deps (libinput and xkbcommon for the keyboard target)
        run: |
          sudo apt-get update
          sudo apt-get install -y libinput-dev libudev-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Every fuzz target for 30 seconds
        run: ./fuzz/run.sh 30

  vkms:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libseat-dev libinput-dev libxkbcommon-dev \
            libudev-dev libgbm-dev libdrm-dev libfontconfig-dev libclang-dev libpam0g-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Load vkms
        id: vkms
        run: sudo modprobe vkms && echo "have=1" >> "$GITHUB_OUTPUT" || echo "have=0" >> "$GITHUB_OUTPUT"
      - name: Modeset + page-flip on vkms
        if: steps.vkms.outputs.have == '1'
        run: |
          cargo build -p vigil --example test_pattern
          card=$(for c in /sys/class/drm/card[0-9]; do \
            { readlink -f "$c/device"; readlink "$c/device/driver"; } 2>/dev/null \
              | grep -q vkms && basename "$c" && break; done || true)
          if [ -z "$card" ]; then
            uname -r
            for c in /sys/class/drm/card[0-9]; do echo "$c -> $(readlink -f "$c/device")"; done
            exit 1
          fi
          sudo ./target/debug/examples/test_pattern "/dev/dri/$card" 1
