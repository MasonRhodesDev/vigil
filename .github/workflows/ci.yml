name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps (smithay backends, xkbcommon)
        run: |
          sudo apt-get update
          sudo apt-get install -y libseat-dev libinput-dev libxkbcommon-dev \
            libudev-dev libgbm-dev libdrm-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # M1: golden-image job (pure headless, gates merges).
  # M1: vkms job — modprobe vkms, run the real binary, writeback screenshots.
  #     Best-effort if the runner kernel lacks vkms (risk register #4).
  # M2: QEMU virtio-gpu max_outputs=2 — hotplug + panel-migration tests.
