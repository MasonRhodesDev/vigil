name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The nested-compositor suite gates the release (issue #44): rebuilt and
  # re-run on the tag itself, not just trusted from the branch run.
  nested-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: System deps (sway headless + build deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y libseat-dev libinput-dev libxkbcommon-dev \
            libudev-dev libgbm-dev libdrm-dev libfontconfig-dev libclang-dev libpam0g-dev \
            sway wtype
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install the lock PAM service
        run: sudo install -Dm644 dist/vigil-lock.pam /etc/pam.d/vigil-lock
      - run: cargo build -p vigil-lock
      - run: cargo build -p vigil-wayland --example lock_probe
      - run: ./tests/nested/run.sh

  release:
    needs: nested-gate
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/release.yml@v1
    secrets: inherit
    with:
      spec-name: vigil
      copr-project: vigil
      security: true
