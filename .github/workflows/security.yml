name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: MasonRhodesDev/packaging-workflows/.github/workflows/security.yml@3d0c5630674f086918226d0140c51b97887c799f # v1

  advisory-expiry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: python3 -I tests/gates/gate.py advisories
